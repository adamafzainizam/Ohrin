name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "ohrin/**"
      - "web/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 gir1.2-girepository-3.0 libgirepository-2.0-dev libcairo2-dev pkg-config
          python -m pip install PyGObject

      - name: Windows FFmpeg
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: macOS FFmpeg
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install PyTorch (CPU index)
        if: runner.os != 'macOS'
        run: python -m pip install "torch>=2.13.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install PyTorch (PyPI)
        if: runner.os == 'macOS'
        run: python -m pip install "torch>=2.13.0"

      - name: Install desktop requirements
        run: python -m pip install -r requirements-desktop.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Node tests
        run: node tests/app.test.mjs

      - name: Build with PyInstaller
        run: pyinstaller packaging/ohrin.spec --noconfirm --distpath dist --workpath build

      - name: Self-test (Linux)
        if: runner.os == 'Linux'
        env:
          OHRIN_SELFTEST_STRICT: "1"
        run: dist/Ohrin/Ohrin --self-test --self-test-report st.json

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        env:
          OHRIN_SELFTEST_STRICT: "1"
        run: dist/Ohrin.app/Contents/MacOS/Ohrin --self-test --self-test-report st.json

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          OHRIN_SELFTEST_STRICT: "1"
        run: |
          $p = Start-Process dist\Ohrin\Ohrin.exe -ArgumentList '--self-test','--self-test-report','st.json' -Wait -PassThru
          Write-Host "exit code: $($p.ExitCode)"
          if (Test-Path st.json) { Get-Content st.json }
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Print self-test report
        if: runner.os != 'Windows' && always()
        run: cat st.json || true

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf Ohrin-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C dist Ohrin

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Ohrin -DestinationPath Ohrin-${{ matrix.os }}-${{ matrix.arch }}.zip

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Ohrin.app Ohrin-${{ matrix.os }}-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ohrin-${{ github.sha }}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            Ohrin-${{ matrix.os }}-${{ matrix.arch }}.*
            st.json
          retention-days: 14
